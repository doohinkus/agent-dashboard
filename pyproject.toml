[project]
name = "agent-activity-dashboard"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.3",
    "gradio>=4.41",
    "pandas>=3.0.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
agent-dashboard = "app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["app.py"]
